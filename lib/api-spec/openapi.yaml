openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Staff session status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSession" }
    post:
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffCredentials" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSession" }
        "401":
          description: Invalid credentials
        "403":
          description: Staff access required
        "429":
          description: Too many attempts
        "503":
          description: Staff access is not configured
    delete:
      operationId: logoutAdmin
      responses:
        "204":
          description: Signed out
  /admin/catalog:
    get:
      operationId: getAdminCatalog
      responses:
        "200":
          description: All products and occasions including disabled records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalog" }
        "401":
          description: Sign in required
        "403":
          description: Staff access required
        "503":
          description: Catalog unavailable
  /admin/products:
    post:
      operationId: createAdminProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProduct" }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        "400":
          description: Invalid product
        "401":
          description: Sign in required
        "403":
          description: Staff access required
        "409":
          description: ID already exists
  /admin/products/{id}:
    put:
      operationId: updateAdminProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProduct" }
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        "400":
          description: Invalid product
        "401":
          description: Sign in required
        "403":
          description: Staff access required
        "404":
          description: Product not found
  /admin/occasions:
    post:
      operationId: createAdminOccasion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminOccasion" }
      responses:
        "201":
          description: Occasion created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOccasion" }
        "400":
          description: Invalid occasion
        "401":
          description: Sign in required
        "403":
          description: Staff access required
        "409":
          description: ID already exists
  /admin/occasions/{id}:
    put:
      operationId: updateAdminOccasion
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminOccasion" }
      responses:
        "200":
          description: Occasion updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOccasion" }
        "400":
          description: Invalid occasion
        "401":
          description: Sign in required
        "403":
          description: Staff access required
        "404":
          description: Occasion not found
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: Read the available Tawwa storefront catalog
      responses:
        "200":
          description: Ordered catalog from Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "503":
          description: Catalog temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    StaffCredentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }
    StaffSession:
      type: object
      required: [authenticated, configured]
      properties:
        authenticated: { type: boolean }
        configured: { type: boolean }
    AdminCatalog:
      type: object
      required: [products, occasions]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/AdminProduct" }
        occasions:
          type: array
          items: { $ref: "#/components/schemas/AdminOccasion" }
    AdminOccasion:
      type: object
      required: [id, name_en, name_ar, icon, is_active, display_order]
      properties:
        id: { type: string, minLength: 1, maxLength: 80, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        name_en: { type: string, minLength: 1, maxLength: 200 }
        name_ar: { type: string, minLength: 1, maxLength: 200 }
        icon: { type: string, enum: [gift, heart, sparkles, sun, award, rings, moon] }
        is_active: { type: boolean }
        display_order: { type: integer, minimum: 0, maximum: 100000 }
    AdminProduct:
      type: object
      required: [id, occasion_id, age_group, name_en, name_ar, description_en, description_ar, contents_en, contents_ar, price, ideal_for_en, ideal_for_ar, delivery_en, delivery_ar, is_available, display_order]
      properties:
        id: { type: string, minLength: 1, maxLength: 80, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        occasion_id: { type: string, minLength: 1, maxLength: 80 }
        age_group: { type: ["string", "null"], maxLength: 80 }
        name_en: { type: string, minLength: 1, maxLength: 200 }
        name_ar: { type: string, minLength: 1, maxLength: 200 }
        description_en: { type: string, minLength: 1, maxLength: 4000 }
        description_ar: { type: string, minLength: 1, maxLength: 4000 }
        contents_en:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 500 }
        contents_ar:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 500 }
        price: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        ideal_for_en: { type: string, minLength: 1, maxLength: 1000 }
        ideal_for_ar: { type: string, minLength: 1, maxLength: 1000 }
        delivery_en: { type: string, minLength: 1, maxLength: 1000 }
        delivery_ar: { type: string, minLength: 1, maxLength: 1000 }
        is_available: { type: boolean }
        display_order: { type: integer, minimum: 0, maximum: 100000 }
    Catalog:
      type: object
      required: [occasions, products, governorates]
      properties:
        occasions:
          type: array
          items:
            $ref: "#/components/schemas/CatalogOccasion"
        products:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
        governorates:
          type: array
          items:
            type: string
    CatalogOccasion:
      type: object
      required: [id, name, ar, icon]
      properties:
        id: { type: string }
        name: { type: string }
        ar: { type: string }
        icon: { type: string }
    CatalogProduct:
      type: object
      required: [id, occasion, name, ar, description, descriptionAr, contents, contentsAr, price, idealFor, idealForAr, delivery, deliveryAr]
      properties:
        id: { type: string }
        occasion: { type: string }
        age: { type: string }
        name: { type: string }
        ar: { type: string }
        description: { type: string }
        descriptionAr: { type: string }
        contents:
          type: array
          items: { type: string }
        contentsAr:
          type: array
          items: { type: string }
        price: { type: number, exclusiveMinimum: 0 }
        idealFor: { type: string }
        idealForAr: { type: string }
        delivery: { type: string }
        deliveryAr: { type: string }
    CatalogError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

