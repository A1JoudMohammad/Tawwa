openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /payments/config:
    get:
      operationId: getTawwaPaymentConfig
      responses:
        "200":
          description: Test-mode payment configuration safe for the storefront
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentConfig" }
  /payments/checkout:
    post:
      operationId: createTawwaCheckout
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 100 }
        - name: X-Order-Access-Token
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "200":
          description: Stripe-hosted checkout session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "400":
          description: Invalid cart or delivery details
        "409":
          description: Cart changed or idempotency key reused
        "503":
          description: Payments are not configured
  /payments/order-status:
    post:
      operationId: getTawwaPaymentOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentOrderLookupInput" }
      responses:
        "200":
          description: Payment status and gift details for confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrder" }
        "404":
          description: Order not found
        "503":
          description: Payments are not configured
  /admin/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Staff session status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSession" }
    post:
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffCredentials" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSession" }
        "401":
          description: Invalid credentials
        "403":
          description: Staff access required
        "429":
          description: Too many attempts
        "503":
          description: Staff access is not configured
    delete:
      operationId: logoutAdmin
      responses:
        "204":
          description: Signed out
  /admin/catalog:
    get:
      operationId: getAdminCatalog
      responses:
        "200":
          description: All products and occasions including disabled records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCatalog" }
        "401":
          description: Sign in required
        "403":
          description: Staff access required
        "503":
          description: Catalog unavailable
  /admin/products:
    post:
      operationId: createAdminProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProduct" }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        "400":
          description: Invalid product
        "401":
          description: Sign in required
        "403":
          description: Staff access required
        "409":
          description: ID already exists
  /admin/products/{id}:
    put:
      operationId: updateAdminProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProduct" }
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
        "400":
          description: Invalid product
        "401":
          description: Sign in required
        "403":
          description: Staff access required
        "404":
          description: Product not found
  /admin/occasions:
    post:
      operationId: createAdminOccasion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminOccasion" }
      responses:
        "201":
          description: Occasion created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOccasion" }
        "400":
          description: Invalid occasion
        "401":
          description: Sign in required
        "403":
          description: Staff access required
        "409":
          description: ID already exists
  /admin/occasions/{id}:
    put:
      operationId: updateAdminOccasion
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminOccasion" }
      responses:
        "200":
          description: Occasion updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOccasion" }
        "400":
          description: Invalid occasion
        "401":
          description: Sign in required
        "403":
          description: Staff access required
        "404":
          description: Occasion not found
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: Read the available Tawwa storefront catalog
      responses:
        "200":
          description: Ordered catalog from Supabase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "503":
          description: Catalog temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    CheckoutItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, minLength: 1, maxLength: 80, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        quantity: { type: integer, minimum: 1, maximum: 10 }
        message: { type: string, maxLength: 300 }
        date: { type: string, format: date }
    CheckoutInput:
      type: object
      required: [items, email, name, phone, governorate, address]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/CheckoutItemInput" }
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: string, minLength: 8, maxLength: 24, pattern: "^[+0-9 ()-]+$" }
        governorate: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 4, maxLength: 500 }
        recipient: { type: string, maxLength: 160 }
    CheckoutSession:
      type: object
      required: [checkoutUrl, orderId, deliveryFee, total]
      properties:
        checkoutUrl: { type: string, format: uri }
        orderId: { type: string, format: uuid }
        deliveryFee: { type: number }
        total: { type: number }
    PaymentConfig:
      type: object
      required: [deliveryFee, currency, testMode]
      properties:
        deliveryFee: { type: number, minimum: 0 }
        currency: { type: string, enum: [kwd] }
        testMode: { type: boolean }
    PaymentOrderLookupInput:
      type: object
      required: [orderId, sessionId, accessToken]
      properties:
        orderId: { type: string, format: uuid }
        sessionId: { type: string, minLength: 10, maxLength: 255 }
        accessToken: { type: string, minLength: 32, maxLength: 128 }
    PaymentOrderItem:
      type: object
      required: [productId, name, nameAr, quantity, unitPrice, message, date]
      properties:
        productId: { type: string }
        name: { type: string }
        nameAr: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        message: { type: string }
        date: { type: string }
    PaymentOrder:
      type: object
      required: [orderId, status, currency, subtotal, deliveryFee, total, items]
      properties:
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [pending, paid, failed, expired] }
        currency: { type: string, enum: [kwd] }
        subtotal: { type: number }
        deliveryFee: { type: number }
        total: { type: number }
        items:
          type: array
          items: { $ref: "#/components/schemas/PaymentOrderItem" }
    StaffCredentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }
    StaffSession:
      type: object
      required: [authenticated, configured]
      properties:
        authenticated: { type: boolean }
        configured: { type: boolean }
    AdminCatalog:
      type: object
      required: [products, occasions]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/AdminProduct" }
        occasions:
          type: array
          items: { $ref: "#/components/schemas/AdminOccasion" }
    AdminOccasion:
      type: object
      required: [id, name_en, name_ar, icon, is_active, display_order]
      properties:
        id: { type: string, minLength: 1, maxLength: 80, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        name_en: { type: string, minLength: 1, maxLength: 200 }
        name_ar: { type: string, minLength: 1, maxLength: 200 }
        icon: { type: string, enum: [gift, heart, sparkles, sun, award, rings, moon] }
        is_active: { type: boolean }
        display_order: { type: integer, minimum: 0, maximum: 100000 }
    AdminProduct:
      type: object
      required: [id, occasion_id, age_group, name_en, name_ar, description_en, description_ar, contents_en, contents_ar, price, ideal_for_en, ideal_for_ar, delivery_en, delivery_ar, is_available, display_order]
      properties:
        id: { type: string, minLength: 1, maxLength: 80, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        occasion_id: { type: string, minLength: 1, maxLength: 80 }
        age_group: { type: ["string", "null"], maxLength: 80 }
        name_en: { type: string, minLength: 1, maxLength: 200 }
        name_ar: { type: string, minLength: 1, maxLength: 200 }
        description_en: { type: string, minLength: 1, maxLength: 4000 }
        description_ar: { type: string, minLength: 1, maxLength: 4000 }
        contents_en:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 500 }
        contents_ar:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 500 }
        price: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        ideal_for_en: { type: string, minLength: 1, maxLength: 1000 }
        ideal_for_ar: { type: string, minLength: 1, maxLength: 1000 }
        delivery_en: { type: string, minLength: 1, maxLength: 1000 }
        delivery_ar: { type: string, minLength: 1, maxLength: 1000 }
        is_available: { type: boolean }
        display_order: { type: integer, minimum: 0, maximum: 100000 }
    Catalog:
      type: object
      required: [occasions, products, governorates]
      properties:
        occasions:
          type: array
          items:
            $ref: "#/components/schemas/CatalogOccasion"
        products:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
        governorates:
          type: array
          items:
            type: string
    CatalogOccasion:
      type: object
      required: [id, name, ar, icon]
      properties:
        id: { type: string }
        name: { type: string }
        ar: { type: string }
        icon: { type: string }
    CatalogProduct:
      type: object
      required: [id, occasion, name, ar, description, descriptionAr, contents, contentsAr, price, idealFor, idealForAr, delivery, deliveryAr]
      properties:
        id: { type: string }
        occasion: { type: string }
        age: { type: string }
        name: { type: string }
        ar: { type: string }
        description: { type: string }
        descriptionAr: { type: string }
        contents:
          type: array
          items: { type: string }
        contentsAr:
          type: array
          items: { type: string }
        price: { type: number, exclusiveMinimum: 0 }
        idealFor: { type: string }
        idealForAr: { type: string }
        delivery: { type: string }
        deliveryAr: { type: string }
    CatalogError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

